name: Scrape bank auctions

# Runs on Raju's Windows PC (self-hosted runner) because BAANKNET blocks
# GitHub's own servers. If the PC is off at the scheduled time, GitHub keeps
# the job queued for up to 24 hours and runs it as soon as the PC is back on.

on:
  schedule:
    - cron: "17 1 * * *"   # daily 06:47 IST
  push:
    branches: [main]
    paths: ["scraper/**", "requirements.txt", ".github/workflows/scrape.yml"]
  workflow_dispatch:
    inputs:
      discover:
        description: "Save raw API responses for debugging"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python -m playwright install chromium

      - name: Scrape
        run: |
          if ("${{ github.event_name }}" -eq "push" -or "${{ inputs.discover }}" -eq "true") {
            python -u scraper/run.py --discover
          } else {
            python -u scraper/run.py
          }

      - name: Upload raw responses (discover mode)
        if: ${{ always() && (github.event_name == 'push' || inputs.discover) }}
        uses: actions/upload-artifact@v4
        with:
          name: raw-responses
          path: scraper/debug/
          if-no-files-found: ignore

      - name: Commit data
        if: always()
        run: |
          git config user.name  "auction-bot"
          git config user.email "auction-bot@users.noreply.github.com"
          git add docs/data scraper/cache
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update listings $(Get-Date -Format yyyy-MM-dd)"
            git pull --rebase
            git push
          }
          exit 0
